<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #1b1b1b;
    border-bottom: 2px solid #333;
    padding: 20px;
}

.header {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 27px;
    font-weight: bold;
}

.home {
    color: #aaa;
    text-decoration: none;
}

.home:hover {
    color: white;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.game-page {
    background: #1b1b1b;
    border-radius: 12px;
    padding: 35px;
}

h1 {
    font-size: 42px;
    margin-top: 0;
}

.game-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 40px;
}

.cover {
    width: 320px;
    height: 430px;
    background: #292929;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: #777;
    text-align: center;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.description {
    color: #bbb;
    font-size: 17px;
    line-height: 1.7;
}

.details {
    background: #242424;
    border-radius: 8px;
    padding: 20px;
    margin-top: 25px;
}

.details p {
    margin: 10px 0;
}

.download {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 28px;
    background: #2878ff;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.download:hover {
    background: #155dcc;
}

.screenshots {
    margin-top: 50px;
}

.screenshots h2 {
    margin-bottom: 20px;
}

.screenshot-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.screenshot {
    height: 180px;
    background: #292929;
    border-radius: 8px;
    overflow: hidden;
}

.screenshot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.2s;
}

.screenshot img:hover {
    transform: scale(1.03);
}

.no-screenshots {
    color: #777;
    padding: 20px 0;
}

.back {
    display: inline-block;
    margin-top: 35px;
    color: #aaa;
    text-decoration: none;
}

.back:hover {
    color: white;
}

.not-found {
    text-align: center;
    padding: 80px 20px;
}

footer {
    margin-top: 60px;
    padding: 30px;
    text-align: center;
    color: #777;
    background: #1b1b1b;
}

@media(max-width: 700px) {

    .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
    }

    .game-layout {
        grid-template-columns: 1fr;
    }

    .cover {
        width: 100%;
        max-width: 320px;
    }

    .screenshot-grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 32px;
    }
}

</style>

"wild-metal-country": {
name: "Wild Metal Country",
genre: "Action",
platform: "Windows",
description: "Control heavily armed vehicles across alien environments in this futuristic action game.",
image: "images/wild-metal-country.jpg"
},

"wwf-raw-2002": {
name: "WWF Raw 2002",
genre: "Sports",
platform: "Windows",
description: "Enter the ring with classic WWF wrestlers in this wrestling game featuring matches and different game modes.",
image: "images/wwf-raw-2002.jpg"
}

};


/*
====================================================
LOAD GAME
====================================================
*/

const params = new URLSearchParams(window.location.search);

const gameID = params.get("game");

const game = games[gameID];

const container = document.getElementById("gameContainer");


if (!game) {

    container.innerHTML = `

    <div class="game-page not-found">

        <h1>Game Not Found</h1>

        <p>
        That game doesn't exist in the GameBox archive.
        </p>

        <a class="back" href="index.html">
        ← Return to GameBox
        </a>

    </div>

    `;

} else {

    document.title = game.name + " - GameBox.exe";


    /*
    ================================================
    BUILD SCREENSHOTS
    ================================================
    */

    let screenshotHTML = "";

    if (game.screenshots && game.screenshots.length > 0) {

        screenshotHTML = game.screenshots.map(function(image, index) {

            return `
            
            <div class="screenshot">

                <img
                    src="${image}"
                    alt="${game.name} screenshot ${index + 1}"
                    onerror="this.parentElement.innerHTML='<span style=&quot;color:#777;&quot;>Screenshot unavailable</span>';"
                >

            </div>

            `;

        }).join("");

    } else {

        screenshotHTML = `
        
        <p class="no-screenshots">
            No screenshots available yet.
        </p>

        `;

    }


    /*
    ================================================
    BUILD GAME PAGE
    ================================================
    */

    container.innerHTML = `

    <div class="game-page">

        <h1>
            ${game.name}
        </h1>


        <div class="game-layout">


            <div class="cover">

                <img
                    src="${game.image}"
                    alt="${game.name}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                >

                <span style="display:none;">
                    ${game.name}
                </span>

            </div>


            <div>

                <p class="description">
                    ${game.description}
                </p>


                <div class="details">

                    <p>
                        <strong>Genre:</strong>
                        ${game.genre}
                    </p>

                    <p>
                        <strong>Platform:</strong>
                        ${game.platform}
                    </p>

                    <p>
                        <strong>Game:</strong>
                        ${game.name}
                    </p>

                </div>


                <a
                    class="download"
                    href="#"
                    onclick="alert('Add your legally distributable game file here.'); return false;"
                >
                    ⬇ Download
                </a>


            </div>

        </div>


        <div class="screenshots">

            <h2>
                📸 Screenshots
            </h2>

            <div class="screenshot-grid">

                ${screenshotHTML}

            </div>

        </div>


        <a class="back" href="index.html">
            ← Back to GameBox.exe
        </a>


    </div>

    `;

}

</script>

</body>
</html>
