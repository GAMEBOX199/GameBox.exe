<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: #1b1b1b;
    border-bottom: 2px solid #333;
    padding: 20px;
}

.header {
    max-width: 1200px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 27px;
    font-weight: bold;
}

.home {
    color: #aaa;
    text-decoration: none;
}

.home:hover {
    color: white;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 40px 20px;
}

.game-page {
    background: #1b1b1b;
    border-radius: 12px;
    padding: 35px;
}

h1 {
    font-size: 42px;
    margin-top: 0;
}

.game-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 40px;
}

.cover {
    width: 320px;
    height: 430px;
    background: #292929;
    border-radius: 10px;
    overflow: hidden;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.description {
    color: #bbb;
    font-size: 17px;
    line-height: 1.7;
}

.details {
    background: #242424;
    border-radius: 8px;
    padding: 20px;
    margin-top: 25px;
}

.details p {
    margin: 10px 0;
}

.download {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 28px;
    background: #2878ff;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    font-weight: bold;
}

.download:hover {
    background: #155dcc;
}

.screenshots {
    margin-top: 50px;
}

.screenshot-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.screenshot {
    height: 180px;
    background: #292929;
    border-radius: 8px;
    overflow: hidden;
}

.screenshot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.no-screenshots {
    color: #777;
}

.back {
    display: inline-block;
    margin-top: 35px;
    color: #aaa;
    text-decoration: none;
}

.back:hover {
    color: white;
}

.not-found {
    text-align: center;
    padding: 80px 20px;
}

footer {
    margin-top: 60px;
    padding: 30px;
    text-align: center;
    color: #777;
    background: #1b1b1b;
}

@media(max-width: 700px) {

    .header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
    }

    .game-layout {
        grid-template-columns: 1fr;
    }

    .cover {
        width: 100%;
        max-width: 320px;
    }

    .screenshot-grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 32px;
    }
}
</style>

onerror="this.parentElement.innerHTML='<span style=&quot;color:#777;padding:20px;&quot;>Screenshot unavailable</span>';"
>
</div>
`;

}).join("");

} else {

screenshotHTML = `
<p class="no-screenshots">
No screenshots available yet.
</p>
`;

}


/* DOWNLOAD BUTTON */

let downloadHTML = "";

if (game.download) {

downloadHTML = `
<a
class="download"
href="${game.download}"
download
>
⬇ Download

`;

} else {

downloadHTML = `
<a
class="download"
href="#"
onclick="alert('Download coming soon.'); return false;"
>
⬇ Download
</a>
`;

}

container.innerHTML = `
