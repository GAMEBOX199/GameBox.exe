```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameBox.exe - Free Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #1b1b1b;
            padding: 20px 40px;
            border-bottom: 2px solid #333;
        }

        .top {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            white-space: nowrap;
        }

        .search {
            width: 400px;
            max-width: 100%;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 15px;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .hero {
            background: #1b1b1b;
            padding: 35px;
            border-radius: 10px;
            margin-bottom: 35px;
        }

        .hero h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .hero p {
            color: #bbb;
            font-size: 17px;
        }

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .category {
            background: #292929;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
        }

        .category:hover {
            background: #3a3a3a;
        }

        h2 {
            margin-top: 40px;
        }

        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .game {
            background: #1b1b1b;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: white;
            transition: transform 0.15s;
        }

        .game:hover {
            transform: translateY(-5px);
        }

        .cover {
            width: 100%;
            height: 250px;
            background: #292929;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            margin: 0 0 7px 0;
        }

        .game-info p {
            margin: 0;
            color: #999;
            font-size: 14px;
        }

        footer {
            margin-top: 60px;
            padding: 30px;
            text-align: center;
            background: #1b1b1b;
            color: #777;
        }

        @media (max-width: 700px) {
            .top {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="top">

        <div class="logo">
            🎮 GameBox.exe
        </div>

        <input
            class="search"
            type="text"
            placeholder="Search games..."
            id="searchBox"
            onkeyup="searchGames()"
        >

    </div>
</header>


<main>

    <section class="hero">

        <h1>GameBox.exe</h1>

        <p>
            Discover and download games from the GameBox archive.
        </p>

        <div class="categories">

            <a class="category" href="games/gta.html">
                GTA
            </a>

            <a class="category" href="games/horror.html">
                Horror
            </a>

            <a class="category" href="#">
                Action
            </a>

            <a class="category" href="#">
                Adventure
            </a>

            <a class="category" href="#">
                Racing
            </a>

        </div>

    </section>


    <h2>🎮 Games</h2>

    <div class="games" id="gameList">

        <a class="game" href="games/gta.html" data-name="GTA">

            <div class="cover">
                GTA Cover
            </div>

            <div class="game-info">

                <h3>GTA</h3>

                <p>Action • Windows</p>

            </div>

        </a>


        <a class="game" href="games/horror.html" data-name="Horror">

            <div class="cover">
                Horror Games
            </div>

            <div class="game-info">

                <h3>Horror Games</h3>

                <p>Horror • Windows</p>

            </div>

        </a>

    </div>

</main>


<footer>

    GameBox.exe © 2026

</footer>


<script>

function searchGames() {

    let search =
        document.getElementById("searchBox").value.toLowerCase();

    let games =
        document.querySelectorAll(".game");

    games.forEach(function(game) {

        let name =
            game.getAttribute("data-name").toLowerCase();

        if (name.includes(search)) {

            game.style.display = "block";

        } else {

            game.style.display = "none";

        }

    });

}

</script>

</body>
</html>
