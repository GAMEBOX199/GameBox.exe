```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameBox.exe</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #101010;
            color: white;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            background: #181818;
            border-bottom: 1px solid #333;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1300px;
            margin: auto;

            display: flex;
            align-items: center;
            gap: 30px;
        }


        /* LOGO */

        .logo {
            height: 70px;
            width: auto;
            max-width: 300px;
            object-fit: contain;
        }


        /* SEARCH */

        .search-container {
            flex: 1;
            position: relative;
        }

        #search {
            width: 100%;
            padding: 15px 20px;

            border-radius: 8px;
            border: 1px solid #444;

            background: #242424;
            color: white;

            font-size: 16px;
            outline: none;
        }

        #search:focus {
            border-color: #777;
        }


        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1300px;
            margin: auto;
            padding: 40px 25px;
        }


        /* HERO */

        .hero {
            background: #1a1a1a;
            border-radius: 12px;

            padding: 45px;

            margin-bottom: 40px;

            border: 1px solid #292929;
        }

        .hero h1 {
            margin: 0 0 10px 0;
            font-size: 40px;
        }

        .hero p {
            margin: 0;
            color: #aaa;
            font-size: 18px;
        }


        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-top: 30px;
        }

        .category {
            background: #292929;

            color: white;

            padding: 11px 18px;

            border-radius: 7px;

            text-decoration: none;

            cursor: pointer;

            border: none;

            font-size: 14px;
        }

        .category:hover {
            background: #3a3a3a;
        }


        /* =========================
           GAME SECTION
        ========================= */

        .section-title {
            font-size: 28px;
            margin-bottom: 20px;
        }


        /* GAME GRID */

        .games {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(200px, 1fr));

            gap: 22px;
        }


        /* GAME CARD */

        .game {
            background: #1a1a1a;

            border-radius: 10px;

            overflow: hidden;

            text-decoration: none;

            color: white;

            border: 1px solid #292929;

            transition:
                transform 0.2s,
                border-color 0.2s,
                background 0.2s;
        }

        .game:hover {
            transform: translateY(-6px);

            background: #202020;

            border-color: #555;
        }


        /* GAME IMAGE */

        .game-cover {
            width: 100%;

            height: 280px;

            background: #292929;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: #777;

            font-size: 15px;

            padding: 20px;
        }


        /* GAME INFO */

        .game-info {
            padding: 17px;
        }

        .game-info h3 {
            margin: 0 0 8px 0;

            font-size: 18px;
        }

        .game-info p {
            margin: 0;

            color: #999;

            font-size: 14px;
        }


        /* NO RESULTS */

        #noResults {
            display: none;

            text-align: center;

            padding: 60px 20px;

            color: #888;

            font-size: 18px;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 70px;

            background: #181818;

            border-top: 1px solid #333;

            padding: 30px;

            text-align: center;

            color: #777;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {
                padding: 15px;
            }

            .header-container {
                flex-direction: column;

                align-items: stretch;

                gap: 15px;
            }

            .logo {
                width: 100%;

                height: 70px;

                object-fit: contain;
            }

            .hero {
                padding: 30px 25px;
            }

            .hero h1 {
                font-size: 30px;
            }

            .games {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 12px;
            }

            .game-cover {
                height: 220px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="header-container">


        <!-- GAMEBOX IMAGE -->

        <img
            src="Drawing-68.sketchpad.jpeg"
            class="logo"
            alt="GameBox"
        >


        <!-- SEARCH BAR -->

        <div class="search-container">

            <input
                type="text"
                id="search"
                placeholder="🔎 Search games..."
                autocomplete="off"
            >

        </div>


    </div>

</header>



<!-- =========================
     MAIN PAGE
========================= -->

<main>


    <!-- HERO -->

    <section class="hero">

        <h1>GameBox.exe</h1>

        <p>
            Browse the GameBox game archive.
        </p>


        <!-- CATEGORIES -->

        <div class="categories">

            <button
                class="category"
                onclick="filterCategory('all')"
            >
                All Games
            </button>

            <button
                class="category"
                onclick="filterCategory('action')"
            >
                Action
            </button>

            <button
                class="category"
                onclick="filterCategory('horror')"
            >
                Horror
            </button>

            <button
                class="category"
                onclick="filterCategory('adventure')"
            >
                Adventure
            </button>

            <button
                class="category"
                onclick="filterCategory('racing')"
            >
                Racing
            </button>

            <button
                class="category"
                onclick="filterCategory('calm')"
            >
                Calm
            </button>

        </div>

    </section>



    <!-- GAME LIST -->

    <h2 class="section-title">
        🎮 Games
    </h2>


    <div
        class="games"
        id="gameList"
    >


        <!-- GTA -->

        <a
            class="game"
            href="#"
            data-name="GTA"
            data-category="action"
        >

            <div class="game-cover">
                GTA
            </div>

            <div class="game-info">

                <h3>GTA</h3>

                <p>
                    Action • Windows
                </p>

            </div>

        </a>



        <!-- BORIS -->

        <a
            class="game"
            href="boris-and-the-dark-survival.html"
            data-name="Boris and the Dark Survival"
            data-category="horror"
        >

            <div class="game-cover">
                Boris and the Dark Survival
            </div>

            <div class="game-info">

                <h3>
                    Boris and the Dark Survival
                </h3>

                <p>
                    Horror • Windows
                </p>

            </div>

        </a>



        <!-- SPIDER-MAN -->

        <a
            class="game"
            href="#"
            data-name="Spider-Man Web of Shadows"
            data-category="action"
        >

            <div class="game-cover">
                Spider-Man: Web of Shadows
            </div>

            <div class="game-info">

                <h3>
                    Spider-Man: Web of Shadows
                </h3>

                <p>
                    Action • Windows
                </p>

            </div>

        </a>


    </div>



    <!-- NO SEARCH RESULTS -->

    <div id="noResults">

        No games found.

    </div>


</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    GameBox.exe © 2026

</footer>



<!-- =========================
     SEARCH + FILTER
========================= -->

<script>

const searchBox =
    document.getElementById("search");

const games =
    document.querySelectorAll(".game");

const noResults =
    document.getElementById("noResults");



/* SEARCH */

searchBox.addEventListener("input", function() {

    const search =
        searchBox.value
        .toLowerCase()
        .trim();

    let visibleGames = 0;


    games.forEach(function(game) {

        const name =
            game
            .getAttribute("data-name")
            .toLowerCase();


        if (name.includes(search)) {

            game.style.display = "block";

            visibleGames++;

        } else {

            game.style.display = "none";

        }

    });


    if (visibleGames === 0) {

        noResults.style.display = "block";

    } else {

        noResults.style.display = "none";

    }

});



/* CATEGORY FILTER */

function filterCategory(category) {

    searchBox.value = "";

    let visibleGames = 0;


    games.forEach(function(game) {

        const gameCategory =
            game.getAttribute("data-category");


        if (
            category === "all" ||
            gameCategory === category
        ) {

            game.style.display = "block";

            visibleGames++;

        } else {

            game.style.display = "none";

        }

    });


    if (visibleGames === 0) {

        noResults.style.display = "block";

    } else {

        noResults.style.display = "none";

    }

}

</script>


</body>
</html>
```
